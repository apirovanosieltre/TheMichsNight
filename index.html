<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#15102c" />
  <meta name="description" content="The Mich's Night: un regalo da scoprire, una sfida alla volta." />
  <title>The Mich's Night 🎁</title>
  <link rel="icon" href="assets/mich-avatar.webp?v=20261114-photos" type="image/webp" />
  <link rel="stylesheet" href="styles.css?v=20261114-compact-ducks-v1" />
  <script src="loader.js?v=20261114-compact-ducks-v1" defer></script>
  <script src="finale-music.js?v=20261114-revisit-safari-v2" defer></script>
  <script src="app.js?v=20261114-revisit-safari-v2" defer></script>
</head>
<body>
 <div id="duck-loader" class="is-visible" role="status" aria-label="Caricamento in corso: otto paperelle in movimento" aria-live="off">
  <div class="duck-box">
   <div class="duck-box-header">
    <span class="duck-loader-kicker" aria-hidden="true">✦ ARCADE LOADING ✦</span>
    <h2>THE MICH'S NIGHT <span class="duck-title-icon" aria-hidden="true">🦆</span></h2>
    <p class="duck-sub">OPERAZIONE PAPERE IN CORSO...</p>
   </div>
   <div class="duck-loader-stage" aria-hidden="true">
    <div class="duck-loader-ring"></div>
    <div id="duck-orbit" class="duck-orbit"></div>
    <div class="duck-center"><strong>QUACK!</strong><small>LOADING</small></div>
   </div>
   <div class="duck-box-footer">
    <p id="duck-loader-text" class="duck-loader-text">PREPARAZIONE MISSIONE...</p>
    <div class="duck-loader-progress" aria-hidden="true"><span class="duck-loader-progress-fill"></span></div>
    <div class="duck-sound-row">
     <button type="button" id="duck-audio-unlock" class="duck-audio-unlock" aria-label="Attiva il suono delle paperelle"><span aria-hidden="true">🔊</span> ATTIVA I QUACK</button>
     <span id="duck-audio-state" class="duck-audio-state" hidden></span>
    </div>
   </div>
  </div>
 </div>
 <div class="stars" aria-hidden="true"></div>
 <div class="app-window">
  <header class="window-bar"><div class="window-caption"><span class="win-gift">🎁</span><span>The Mich's Night</span><span class="window-sub">/ missione compleanno</span></div><div class="window-actions" aria-hidden="true"><span>━</span><span>▣</span><span>✕</span></div></header>
  <div class="workspace">
   <aside class="sidebar">
    <div class="sidebar-profile"><img src="assets/mich-avatar.webp?v=20261114-photos" alt="Avatar cartoon originale di Mich"/><span class="online-dot" title="VIP collegato"></span><small>GIOCATORE 01</small><strong>★ MICH ★</strong></div>
    <nav class="side-nav" aria-label="Navigazione principale">
      <button type="button" data-route="home"><span>⌂</span>Home</button>
      <button type="button" data-route="missioni"><span>🎮</span>Le missioni</button>
      <button type="button" data-route="scoperte"><span>✦</span>Le scoperte</button>
      <button type="button" data-route="finale"><span>🎁</span>Il gran finale</button>
      <button type="button" data-route="info"><span>ⓘ</span>Info utili</button>
    </nav>
    <div class="sidebar-bottom"><span class="pixel-cake">🎂</span><span>100% FATTO CON<br/>GLI AMICI 💜</span></div>
   </aside>
   <main id="app" class="main-content" tabindex="-1" aria-live="polite"></main>
  </div>
  <footer class="status-bar"><span>● SISTEMA OPERATIVO: MICH OS 1.0</span><span id="status-progress">PROGRESSO: 0/3</span><button id="sound-toggle" type="button" aria-label="Attiva o disattiva l'audio">♫ AUDIO ON</button></footer>
 </div>
 <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
